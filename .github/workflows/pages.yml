name: Deploy approved demo to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /jezykowastacja
          NEXT_PUBLIC_SITE_URL: https://przemeq25.github.io/jezykowastacja
          NEXT_PUBLIC_ENABLE_LIVE_DATA: 'false'
          NEXT_PUBLIC_SANITY_PROJECT_ID: f1yzh257
          NEXT_PUBLIC_SANITY_DATASET: stacja
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run check:export
      - run: npm ci --prefix studio
      - run: npm run typecheck --prefix studio
      - run: npm run build --prefix studio
      - run: node scripts/package-studio.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
